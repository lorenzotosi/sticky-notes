name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    with:
      full_build: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}

  release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.result == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml

  docs:
    needs: quality
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && needs.quality.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
