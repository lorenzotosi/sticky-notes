name: Quality

on:
  workflow_call:
    inputs:
      full_build:
        description: Build every deliverable after running the checks
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_build:
        description: Build every deliverable after running the checks
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_MONGODB_URI: "mongodb://127.0.0.1:27018/?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Configure Chrome for browser tests
        run: |
          google-chrome --version
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Validate commits
        if: github.event_name == 'pull_request'
        run: npx --yes --package @commitlint/cli --package @commitlint/config-conventional commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Run checks
        if: ${{ !inputs.full_build }}
        run: ./gradlew check --no-daemon
      - name: Run full build
        if: ${{ inputs.full_build }}
        run: ./gradlew fullBuild --no-daemon
      - name: Upload deliverables
        if: ${{ inputs.full_build }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deliverables
          path: |
            backend/build/libs/backend.jar
            commons/build/libs/
            frontend/dist/
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
            commons/build/reports/tests/
            commons/build/test-results/
          if-no-files-found: warn
      - name: Stop test services
        if: always()
        run: docker compose -f compose.test.yaml down
