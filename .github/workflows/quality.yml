name: Quality

on:
  workflow_call:
    inputs:
      full_build:
        description: Build every deliverable after running the checks
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_build:
        description: Build every deliverable after running the checks
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux-verify:
    runs-on: ubuntu-latest
    env:
      TEST_MONGODB_URI: "mongodb://127.0.0.1:27018/?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Configure Chrome for browser tests
        run: |
          google-chrome --version
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Validate commits
        if: github.event_name == 'pull_request'
        run: npx --yes --package @commitlint/cli --package @commitlint/config-conventional commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Run checks
        if: ${{ !inputs.full_build && github.event_name != 'pull_request' }}
        run: ./gradlew check --no-daemon
      - name: Run full verification
        if: ${{ inputs.full_build || github.event_name == 'pull_request' }}
        run: ./gradlew fullVerify --no-daemon
      - name: Upload deliverables
        if: ${{ inputs.full_build }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deliverables
          retention-days: 14
          path: |
            backend/build/libs/backend.jar
            commons/build/libs/
            frontend/dist/
            build/docs/
      - name: Upload test, coverage, and E2E reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-linux
          retention-days: 14
          path: |
            backend/build/reports/tests/
            backend/build/reports/jacoco/
            backend/build/test-results/
            commons/build/reports/tests/
            commons/build/reports/jacoco/
            commons/build/test-results/
            frontend/coverage/
            frontend/build/reports/playwright/
            frontend/build/test-results/e2e/
            frontend/build/test-results/e2e-artifacts/
          if-no-files-found: warn
      - name: Stop test services
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Configure Chrome for browser tests
        run: |
          CHROME_PATH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "$CHROME_PATH" --version
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Run non-Docker portability checks
        run: ./gradlew spotlessCheck verifyLicense :commons:check :backend:test :backend:jacocoTestCoverageVerification :frontend:frontendCheck --no-daemon
      - name: Upload macOS test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-macos
          retention-days: 14
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/
            backend/build/test-results/test/
            commons/build/reports/tests/
            commons/build/reports/jacoco/
            commons/build/test-results/
            frontend/coverage/
          if-no-files-found: warn

  verify:
    needs: [linux-verify, macos-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce all quality jobs succeeded
        run: |
          echo "linux-verify result: ${{ needs.linux-verify.result }}"
          echo "macos-smoke result: ${{ needs.macos-smoke.result }}"
          if [ "${{ needs.linux-verify.result }}" != "success" ] || [ "${{ needs.macos-smoke.result }}" != "success" ]; then
            echo "Quality gate failed because one or more required jobs did not succeed." >&2
            exit 1
          fi
