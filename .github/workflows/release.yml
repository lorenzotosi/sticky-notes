name: Release

on:
  workflow_call:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Download deliverables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deliverables
          # The artifact holds the bundle content at its top level, so
          # extracting it into the bundle path keeps the recorded layout.
          path: release-assets/release-bundle
      - name: Verify the release bundle
        # The identity file is editable configuration, so the record covers
        # every other file the ZIP will carry.
        run: cd release-assets/release-bundle && sha256sum --check --quiet SHA256SUMS
      - name: Package deliverables
        # The ZIP root is the Compose project directory: the bundle is
        # extracted and `docker compose up --build` runs in place.
        run: |
          (cd release-assets/release-bundle && zip -qr --owner=0:0 \
            "$GITHUB_WORKSPACE/sticky-notes-deliverables.zip" .)
      - name: Install release tooling
        run: npm ci
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
