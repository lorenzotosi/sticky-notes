name: Release

on:
  workflow_call:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Download deliverables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deliverables
          path: release-assets
      - name: Stamp the build identity
        # Honest identity of the build: the commit and the version the Gradle
        # root derives from it, normalized for Docker tags the way the root
        # build normalizes it. A release publish hook stamps the published
        # SemVer into this same file later.
        run: |
          version="0.0.0-dev+${GITHUB_SHA::12}"
          tag=${version//+/-}
          printf 'STICKY_NOTES_VERSION=%s\nSTICKY_NOTES_REVISION=%s\nAPI_IMAGE=sticky-notes-backend:%s\nWEB_IMAGE=sticky-notes-web:%s\n' "$version" "$GITHUB_SHA" "$tag" "$tag" > release-assets/.env
      - name: Package deliverables
        # The ZIP root is the Compose project directory: dot files
        # (.dockerignore, .env.example, the stamped .env) must land in the archive.
        run: cd release-assets && zip -r --owner=0:0 ../sticky-notes-deliverables.zip .
      - name: Install release tooling
        run: npm ci
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
