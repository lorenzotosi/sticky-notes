name: Release

on:
  workflow_call:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Download deliverables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deliverables
          path: release-assets
      - name: Install release tooling
        run: npm ci
      - name: Stamp the build identity
        # The release version comes from semantic-release, so the dry run
        # resolves it before packaging; the values become the labels of the
        # images the user builds from the ZIP.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(npx semantic-release --dry-run | jq -rs 'map(select(.type == "version"))[0].version // empty')
          version=${version:-0.0.0-dev+${GITHUB_SHA::12}}
          printf 'STICKY_NOTES_VERSION=%s\nSTICKY_NOTES_REVISION=%s\n' "$version" "$GITHUB_SHA" > release-assets/.env
      - name: Package deliverables
        # The ZIP root is the Compose project directory: dot files
        # (.dockerignore, .env.example, the stamped .env) must land in the archive.
        run: cd release-assets && zip -r --owner=0:0 ../sticky-notes-deliverables.zip .
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
