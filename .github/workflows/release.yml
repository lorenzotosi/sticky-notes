name: Release

on:
  workflow_call:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The prepare hook rebuilds the bundle at the published version: the JAR,
    # the Kotlin/JS package, the documentation, and the records, without the
    # test suite. The build is the reason this job needs the toolchain.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          # The release tooling and the frontend build both install from a
          # lockfile, so both caches belong to this job.
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install release tooling
        run: npm ci
      - name: Create GitHub release
        # semantic-release computes the version, runs the `prepare` hook that
        # rebuilds and packages the bundle at that version, then uploads the ZIP
        # as a release asset. A failing build aborts the release before the tag.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
