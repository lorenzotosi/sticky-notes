name: sticky-notes

# Delivery stack of the Sticky Notes Kanban board.
#
# The services reference images by name and never build them here: the stack
# runs the artifacts produced by `./gradlew buildImages` and works on a machine
# without a source checkout, a JDK, or Node.js.
#
# Only the web container publishes a port, and only on the loopback interface,
# so the browser always talks to a single origin and the API and the database
# stay inside the Docker network.

services:
  mongo:
    image: mongo@sha256:f071cbf97a6e52fb7f07ce9ca5d862ad79876bf0eba9ba97758337d740449638
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-stickynotes}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-stickynotes_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-sticky_notes}
    volumes:
      - mongo-data:/data/db
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ${API_IMAGE:-sticky-notes-backend:local}
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-stickynotes}:${MONGO_PASSWORD:-stickynotes_password}@mongo:27017/${MONGO_DATABASE:-sticky_notes}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal-net

  web:
    image: ${WEB_IMAGE:-sticky-notes-web:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  mongo-data:
    
