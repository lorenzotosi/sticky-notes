name: sticky-notes

# Delivery stack of the Sticky Notes Kanban board.
#
# The services reference images by name and build them only when they are
# missing: after `./gradlew buildImages` the stack runs the pre-built images
# unchanged, while a release ZIP carries the binaries and the Dockerfiles, so
# `docker compose up --build` assembles the same images on a machine without a
# source checkout, a JDK, or Node.js.
#
# Only the web container publishes a port, and only on the loopback interface,
# so the browser always talks to a single origin and the API and the database
# stay inside the Docker network.

services:
  mongo:
    image: mongo@sha256:f071cbf97a6e52fb7f07ce9ca5d862ad79876bf0eba9ba97758337d740449638
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-stickynotes_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-stickynotes_local_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-stickynotes}
    volumes:
      - mongo-data:/data/db
    networks:
      - internal-net
    healthcheck:
      # The check authenticates with the credentials of the database user, so
      # the service reports healthy only when the API can connect to it.
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: ${API_IMAGE:-sticky-notes-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${STICKY_NOTES_VERSION:-0.0.0-dev}
        REVISION: ${STICKY_NOTES_REVISION:-unknown}
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-stickynotes_user}:${MONGO_PASSWORD:-stickynotes_local_password}@mongo:27017/${MONGO_DATABASE:-stickynotes}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal-net

  web:
    image: ${WEB_IMAGE:-sticky-notes-web:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VERSION: ${STICKY_NOTES_VERSION:-0.0.0-dev}
        REVISION: ${STICKY_NOTES_REVISION:-unknown}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  mongo-data:

