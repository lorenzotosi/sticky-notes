openapi: 3.0.3
info:
  title: Sticky Notes Kanban API
  description: REST API for the Sticky Notes Kanban board. Command bodies are limited to 65,536 bytes, including chunked transfer. Larger bodies return 413 before command execution.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api
    description: Relative API root behind web reverse proxy

security: []

paths:
  /board:
    get:
      summary: Retrieve current board snapshot
      operationId: getBoard
      responses:
        '200':
          description: Canonical board snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /board/wip-limit:
    put:
      summary: Update DOING column WIP limit
      operationId: updateWipLimit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWipLimitRequest'
      responses:
        '200':
          description: Board snapshot with updated WIP limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /board/notes:
    post:
      summary: Create a new note
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Note created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /board/notes/{id}:
    patch:
      summary: Update note content and/or color
      operationId: updateNote
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Updated board snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Delete a note
      operationId: deleteNote
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
        - name: expectedRevision
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Board snapshot with note removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /board/notes/{id}/move:
    post:
      summary: Move or reorder a note
      operationId: moveNote
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveNoteRequest'
      responses:
        '200':
          description: Board snapshot after movement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /board/notes/{id}/block:
    put:
      summary: Block a note with reason
      operationId: blockNote
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockNoteRequest'
      responses:
        '200':
          description: Board snapshot with blocked note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Unblock a note
      operationId: unblockNote
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
        - name: expectedRevision
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Board snapshot with unblocked note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /board/notes/{id}/checklist:
    post:
      summary: Add a checklist item to a note
      operationId: addChecklistItem
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChecklistItemRequest'
      responses:
        '201':
          description: Checklist item added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChecklistItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /board/notes/{id}/checklist/{itemId}:
    patch:
      summary: Update checklist item label or completion status
      operationId: updateChecklistItem
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
        - name: itemId
          in: path
          required: true
          description: Must contain at least one non-whitespace character.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistItemRequest'
      responses:
        '200':
          description: Board snapshot with updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Delete checklist item
      operationId: deleteChecklistItem
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
        - name: itemId
          in: path
          required: true
          description: Must contain at least one non-whitespace character.
          schema:
            type: string
            minLength: 1
        - name: expectedRevision
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Board snapshot with item removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    NoteIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    NoteStatus:
      type: string
      enum: [TODO, DOING, DONE]

    NoteColor:
      type: string
      enum: [YELLOW, BLUE, GREEN, PINK]

    ChecklistItemSnapshot:
      type: object
      additionalProperties: false
      required: [id, label, completed]
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
          maxLength: 120
        completed:
          type: boolean

    NoteSnapshot:
      type: object
      additionalProperties: false
      required: [id, content, color, status, blockedReason, checklist]
      properties:
        id:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
          maxLength: 500
        color:
          $ref: '#/components/schemas/NoteColor'
        status:
          $ref: '#/components/schemas/NoteStatus'
        blockedReason:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
        checklist:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ChecklistItemSnapshot'

    BoardSnapshot:
      type: object
      additionalProperties: false
      required: [id, schemaVersion, revision, wipLimit, notes]
      properties:
        id:
          type: string
          minLength: 1
          example: main
        schemaVersion:
          type: integer
          enum: [1]
          example: 1
        revision:
          type: integer
          minimum: 0
          example: 0
        wipLimit:
          type: integer
          minimum: 1
          maximum: 20
          example: 3
        notes:
          type: array
          description: Notes in canonical TODO, DOING, DONE status order; rehydration also validates unique IDs, WIP occupancy, blockers, and completed DONE checklists.
          maxItems: 200
          items:
            $ref: '#/components/schemas/NoteSnapshot'

    CreateNoteRequest:
      type: object
      additionalProperties: false
      required: [content, expectedRevision]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
        color:
          type: string
          nullable: true
          enum: [YELLOW, BLUE, GREEN, PINK, null]
          description: Omitted or null uses the default color.
          default: YELLOW
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: A JSON integer token; numeric strings and floating-point tokens are rejected.

    CreateNoteResponse:
      type: object
      required: [board, createdNoteId]
      properties:
        board:
          $ref: '#/components/schemas/BoardSnapshot'
        createdNoteId:
          type: string

    UpdateNoteRequest:
      type: object
      additionalProperties: false
      description: Provide at least one non-null value for content or color. Omitted and null fields stay unchanged.
      required: [expectedRevision]
      anyOf:
        - required: [content]
          properties:
            content: {type: string}
        - required: [color]
          properties:
            color: {type: string}
      properties:
        content:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
        color:
          type: string
          nullable: true
          enum: [YELLOW, BLUE, GREEN, PINK, null]
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: A JSON integer token; numeric strings and floating-point tokens are rejected.

    MoveNoteRequest:
      type: object
      additionalProperties: false
      required: [targetStatus, destinationIndex, expectedRevision]
      properties:
        targetStatus:
          $ref: '#/components/schemas/NoteStatus'
        destinationIndex:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: A JSON integer token; numeric strings and floating-point tokens are rejected.
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: A JSON integer token; numeric strings and floating-point tokens are rejected.

    SetWipLimitRequest:
      type: object
      additionalProperties: false
      required: [limit, expectedRevision]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 20
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: A JSON integer token; numeric strings and floating-point tokens are rejected.

    BlockNoteRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedRevision]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: A JSON integer token; numeric strings and floating-point tokens are rejected.

    AddChecklistItemRequest:
      type: object
      additionalProperties: false
      required: [label, expectedRevision]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: A JSON integer token; numeric strings and floating-point tokens are rejected.

    AddChecklistItemResponse:
      type: object
      required: [board, createdItemId]
      properties:
        board:
          $ref: '#/components/schemas/BoardSnapshot'
        createdItemId:
          type: string

    UpdateChecklistItemRequest:
      type: object
      additionalProperties: false
      description: Provide label, completed, or both. Omitted fields stay unchanged; explicit null values and scalar type coercions are rejected.
      required: [expectedRevision]
      anyOf:
        - required: [label]
        - required: [completed]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        completed:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: A JSON integer token; numeric strings and floating-point tokens are rejected.

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: REVISION_CONFLICT
        message:
          type: string
          example: Board revision does not match expected revision.
        field:
          type: string
          nullable: true
          example: content
        currentRevision:
          type: integer
          nullable: true
          example: 4

  responses:
    BadRequest:
      description: Malformed payload, invalid syntax, or out-of-range value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Requested note or checklist item not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Domain rule violation or revision concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Command body exceeds 65,536 bytes; the board and revision are unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PAYLOAD_TOO_LARGE
            message: Request body exceeds 64 KiB.
    InternalServerError:
      description: Unexpected server failure; the response omits exception details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INTERNAL_SERVER_ERROR
            message: An unexpected error occurred
    ServiceUnavailable:
      description: Database connectivity failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
