name: sticky-notes-tests

services:
  mongo-test:
    image: mongo@sha256:f071cbf97a6e52fb7f07ce9ca5d862ad79876bf0eba9ba97758337d740449638
    ports:
      - "127.0.0.1:27018:27017"
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    image: eclipse-temurin:21-jdk@sha256:3e3c176ffed168beb42c607be9bc1639b466cf00261a0fb04425562c9d0c5c2b
    user: "${TEST_UID:-1000}:${TEST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      GRADLE_USER_HOME: /tmp/gradle
      JAVA_TOOL_OPTIONS: -Duser.home=/tmp
      TEST_MONGODB_URI: mongodb://mongo-test:27017/?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=5000
    depends_on:
      mongo-test:
        condition: service_healthy
    command:
      - ./gradlew
      - :backend:integrationTest
      - --no-daemon
      - --rerun-tasks
      - --project-cache-dir
      - /tmp/project-cache
      - -x
      - :testMongoUp
      - -x
      - :testMongoDown


  mongo-e2e:
    image: mongo@sha256:f071cbf97a6e52fb7f07ce9ca5d862ad79876bf0eba9ba97758337d740449638
    environment:
      MONGO_INITDB_ROOT_USERNAME: stickynotes_e2e
      MONGO_INITDB_ROOT_PASSWORD: stickynotes_e2e_password
      MONGO_INITDB_DATABASE: stickynotes_e2e
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"']
      interval: 2s
      timeout: 5s
      retries: 30

  api-e2e:
    image: ${API_IMAGE:-sticky-notes-backend:local}
    environment:
      MONGODB_URI: mongodb://stickynotes_e2e:stickynotes_e2e_password@mongo-e2e:27017/stickynotes_e2e?authSource=admin
    networks:
      default:
        aliases:
          - api
    depends_on:
      mongo-e2e:
        condition: service_healthy

  web-e2e:
    image: ${WEB_IMAGE:-sticky-notes-web:local}
    depends_on:
      api-e2e:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    ipc: host
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    environment:
      CI: "1"
      E2E_BASE_URL: "http://web-e2e:8080"
    depends_on:
      web-e2e:
        condition: service_started
    command:
      - npx
      - playwright
      - test
